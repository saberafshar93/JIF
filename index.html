<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIF Selector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 10% 30%, #f0f6ff, #dae5f0);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 1.5rem;
        }

        .selector-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 40px;
            padding: 2.5rem 3rem;
            box-shadow: 0 30px 60px -20px rgba(0, 20, 40, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-weight: 700;
            font-size: 2rem;
            color: #0a1c38;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #2d4b72;
            font-size: 1rem;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .year-selector {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .year-btn {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 1.3rem;
            padding: 0.9rem 2.8rem;
            border: none;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.5);
            color: #1f3e62;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .year-btn i {
            font-size: 1.1rem;
            opacity: 0.7;
        }

        .year-btn:hover {
            background: #ffffff;
            transform: scale(1.03);
            box-shadow: 0 12px 24px -12px rgba(20, 60, 120, 0.25);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .year-btn:active {
            transform: scale(0.97);
        }

        .year-btn.btn-2024 {
            background: rgba(26, 46, 107, 0.08);
        }

        .year-btn.btn-2024:hover {
            background: #ffffff;
            color: #0a1e3b;
        }

        .year-btn.btn-2025 {
            background: rgba(136, 84, 208, 0.08);
        }

        .year-btn.btn-2025:hover {
            background: #ffffff;
            color: #0a1e3b;
        }

        @media (max-width: 480px) {
            .selector-card {
                padding: 1.8rem 1.2rem;
            }
            .year-btn {
                font-size: 1.1rem;
                padding: 0.7rem 1.8rem;
                width: 100%;
                justify-content: center;
            }
            .year-selector {
                flex-direction: column;
                gap: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <div class="selector-card">
        <h1>📘 JIF Selector</h1>
        <p class="subtitle">Choose a year to view impact factor data</p>

        <div class="year-selector">
            <a href="https://saberafshar93.github.io/JIF/2024.html" class="year-btn btn-2024">
                <i class="fas fa-calendar-alt"></i> 2024
            </a>
            <a href="https://saberafshar93.github.io/JIF/2025.html" class="year-btn btn-2025">
                <i class="fas fa-calendar-alt"></i> 2025
            </a>
        </div>
    </div>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</body>
</html>

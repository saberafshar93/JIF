<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journal Impact Factor · Year Selector</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 10% 30%, #f0f6ff, #dae5f0);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 1.5rem;
      direction: ltr;
    }

    /* main card – glassmorphism + subtle glow */
    .journal-card {
      max-width: 860px;
      width: 100%;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 56px;
      padding: 2.8rem 2.8rem;
      box-shadow: 0 30px 60px -20px rgba(0, 20, 40, 0.25),
                  0 10px 30px -10px rgba(0, 0, 0, 0.05),
                  inset 0 1px 0 rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    /* decorative orbs */
    .journal-card::before {
      content: '';
      position: absolute;
      top: -15%;
      right: -10%;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(41, 98, 255, 0.10) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .journal-card::after {
      content: '';
      position: absolute;
      bottom: -15%;
      left: -5%;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(136, 84, 208, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .card-content {
      position: relative;
      z-index: 2;
    }

    /* header */
    .header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .header-icon {
      background: linear-gradient(145deg, #1a2e6b, #0f1f4a);
      width: 64px;
      height: 64px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2.1rem;
      box-shadow: 0 14px 20px -8px rgba(18, 40, 85, 0.25);
    }

    .header-text h1 {
      font-weight: 700;
      font-size: 2.1rem;
      letter-spacing: -0.02em;
      color: #0a1c38;
      line-height: 1.2;
    }

    .header-text .sub {
      font-weight: 400;
      font-size: 0.95rem;
      color: #2d4b72;
      background: rgba(255, 255, 255, 0.6);
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      display: inline-block;
      margin-top: 4px;
    }

    /* year selector – two elegant buttons */
    .year-selector {
      background: rgba(235, 244, 255, 0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 80px;
      padding: 0.5rem;
      display: inline-flex;
      gap: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 10px 20px -10px rgba(0, 20, 40, 0.08);
      margin: 1.2rem 0 2.2rem 0;
      width: auto;
    }

    .year-btn {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 1.2rem;
      padding: 0.75rem 2.6rem;
      border: none;
      border-radius: 60px;
      background: transparent;
      color: #1f3e62;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      letter-spacing: 0.3px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      text-decoration: none; /* remove default link style */
    }

    .year-btn i {
      font-size: 1.1rem;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .year-btn:hover {
      background: rgba(255, 255, 255, 0.5);
      transform: scale(1.02);
      color: #0a2848;
    }

    .year-btn.active {
      background: #ffffff;
      color: #0a1e3b;
      box-shadow: 0 14px 24px -12px rgba(20, 60, 120, 0.25), 0 2px 8px rgba(0,0,0,0.02);
      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    .year-btn.active i {
      opacity: 1;
      color: #1f4a7a;
    }

    /* impact panel – clean, minimal */
    .impact-panel {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 1.8rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5), 0 12px 24px -14px rgba(0,0,0,0.06);
    }

    .journal-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(60, 80, 110, 0.12);
      padding-bottom: 1rem;
      margin-bottom: 1.4rem;
    }

    .journal-name {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .journal-name i {
      font-size: 1.6rem;
      color: #1f4b7a;
      background: rgba(255,255,255,0.5);
      padding: 8px;
      border-radius: 16px;
    }

    .journal-name h2 {
      font-weight: 650;
      font-size: 1.6rem;
      color: #0a1d38;
    }

    .journal-badge {
      background: linear-gradient(145deg, #1f3f6b, #123057);
      color: white;
      padding: 0.3rem 1.2rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      box-shadow: 0 6px 12px -6px rgba(18, 48, 87, 0.25);
    }

    /* IF rows */
    .if-row {
      display: flex;
      justify-content: space-between;
      padding: 0.9rem 0.2rem;
      border-bottom: 1px solid rgba(0, 0, 0, 0.03);
      font-size: 1.05rem;
      transition: background 0.15s;
    }

    .if-row:last-of-type {
      border-bottom: none;
    }

    .if-label {
      color: #2d4b6e;
      font-weight: 450;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .if-label i {
      color: #3a6a9e;
      width: 1.4rem;
      font-size: 1rem;
    }

    .if-value {
      font-weight: 650;
      color: #091b35;
      background: rgba(255, 255, 255, 0.4);
      padding: 0.2rem 1.2rem;
      border-radius: 60px;
      font-size: 1.15rem;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .if-value span {
      font-weight: 350;
      font-size: 0.8rem;
      color: #3e5f86;
      margin-left: 0.3rem;
    }

    /* responsive */
    @media (max-width: 680px) {
      .journal-card {
        padding: 1.8rem 1.4rem;
        border-radius: 36px;
      }
      .header-text h1 {
        font-size: 1.5rem;
      }
      .year-selector {
        width: 100%;
        justify-content: center;
        padding: 0.4rem;
        gap: 0.3rem;
      }
      .year-btn {
        font-size: 1rem;
        padding: 0.5rem 1.2rem;
        flex: 1;
        justify-content: center;
      }
      .impact-panel {
        padding: 1rem 1rem;
      }
      .if-row {
        flex-wrap: wrap;
        gap: 0.2rem;
      }
      .if-value {
        width: 100%;
        text-align: left;
        padding: 0.2rem 0.8rem;
      }
    }

    @media (max-width: 460px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      .journal-meta {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }
    }

    /* subtle animation */
    .if-value, .journal-badge {
      transition: all 0.25s ease;
    }
    .year-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

<div class="journal-card">
  <div class="card-content">

    <!-- header -->
    <div class="header">
      <div class="header-icon">
        <i class="fas fa-scroll"></i>
      </div>
      <div class="header-text">
        <h1>Journal Impact Factor</h1>
        <span class="sub"><i class="fas fa-book-open" style="margin-left: 6px;"></i> 2024 · 2025 selector</span>
      </div>
    </div>

    <!-- year buttons: direct links to GitHub pages -->
    <div class="year-selector" id="yearSelector">
      <a href="https://github.com/saberafshar93/JIF/blob/main/2024.html" target="_blank" class="year-btn active" data-year="2024" id="btn2024">
        <i class="fas fa-calendar-alt"></i> 2024
      </a>
      <a href="https://github.com/saberafshar93/JIF/blob/main/2025.html" target="_blank" class="year-btn" data-year="2025" id="btn2025">
        <i class="fas fa-calendar-alt"></i> 2025
      </a>
    </div>

    <!-- impact panel (static demo content) -->
    <div class="impact-panel" id="impactPanel">
      <div class="journal-meta">
        <div class="journal-name">
          <i class="fas fa-university"></i>
          <h2 id="journalTitle">Nature Reviews</h2>
        </div>
        <span class="journal-badge" id="journalBadge"><i class="fas fa-star" style="margin-left: 6px;"></i> Q1</span>
      </div>

      <div class="if-row">
        <span class="if-label"><i class="fas fa-chart-line"></i> Impact Factor</span>
        <span class="if-value" id="ifValue">42.7 <span>↑</span></span>
      </div>
      <div class="if-row">
        <span class="if-label"><i class="fas fa-cubes"></i> Subject Rank</span>
        <span class="if-value" id="rankValue">#2 <span>of 249</span></span>
      </div>
      <div class="if-row">
        <span class="if-label"><i class="fas fa-file-alt"></i> Citations</span>
        <span class="if-value" id="citationValue">18,200 <span>+12%</span></span>
      </div>
      <div class="if-row" style="border-bottom: none; padding-bottom: 0.2rem;">
        <span class="if-label"><i class="fas fa-clock"></i> Year</span>
        <span class="if-value" id="yearDisplay" style="background: transparent; border: none; font-weight: 600;">2024</span>
      </div>
    </div>

    <!-- footer removed as requested -->

  </div>
</div>

<script>
  (function() {
    // Get the two anchor buttons
    const btn2024 = document.getElementById('btn2024');
    const btn2025 = document.getElementById('btn2025');

    // Function to update active class (visual feedback)
    function setActiveYear(year) {
      btn2024.classList.remove('active');
      btn2025.classList.remove('active');
      if (year === 2024) {
        btn2024.classList.add('active');
      } else if (year === 2025) {
        btn2025.classList.add('active');
      }
    }

    // Intercept click to update active state BEFORE navigation (optional)
    // Since they are <a> tags, they will navigate naturally.
    // We just add a click handler to update the active class for visual feedback.
    btn2024.addEventListener('click', function(e) {
      // update active class immediately
      setActiveYear(2024);
      // do not prevent default; let the browser navigate
    });

    btn2025.addEventListener('click', function(e) {
      setActiveYear(2025);
    });

    // set initial active (2024) – matches the href
    setActiveYear(2024);

    // (optional) keyboard accessibility: treat as buttons
    document.querySelectorAll('.year-btn').forEach(btn => {
      btn.setAttribute('role', 'button');
      btn.setAttribute('tabindex', '0');
      // Enter/Space will trigger click (navigation) naturally
    });

    // The year display text in the panel can be updated based on which link is hovered/clicked?
    // But we keep it static as a demo. If you want dynamic, you can add a hover effect.
    // For now, it's fine.
  })();
</script>

</body>
</html>
